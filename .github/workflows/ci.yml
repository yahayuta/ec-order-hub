name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orderhub
          POSTGRES_USER: orderhub
          POSTGRES_PASSWORD: orderhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderhub"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (unit + integration against PostgreSQL)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orderhub
        run: mvn -B verify
      - name: Test summary
        if: always()
        run: |
          echo "| Test class | Tests | Failures | Errors | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/TEST-*.xml; do
            python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          s = ET.parse(sys.argv[1]).getroot()
          print(f"| {s.get('name').split('.')[-1]} | {s.get('tests')} | {s.get('failures')} | {s.get('errors')} | {s.get('skipped')} |")
          EOF
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the container image
        run: docker build -t ec-order-hub:ci .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
